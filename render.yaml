# Abeera API, Postgres, and Key Value.
# Deploys the catalog-orders branch only. The Next.js app stays on Vercel.
# DATABASE_URL and REDIS_URL are injected from the resources below.
# JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, and FRONTEND_URL are set in Render, not in git.
# Render injects PORT. The process binds 0.0.0.0:$PORT.
# JazzCash, EasyPaisa, and Cloudinary stay unset until those keys exist.

services:
  - type: web
    name: abeera-api
    runtime: docker
    branch: cursor/catalog-orders-session-b914
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    preDeployCommand: npm run db:migrate --workspace=@abeera/api
    dockerCommand: npm run start:prod --workspace=@abeera/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: abeera-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: abeera-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: keyvalue
    name: abeera-redis
    plan: 256mb
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: abeera-postgres
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "16"
    diskSizeGB: 1
